<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cultura Festival | Dashboard</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fest: {
              rose: '#e11d48',
              amber: '#d97706',
              emerald: '#059669',
              sky: '#0284c7',
              stone: '#fafaf9',
              dark: '#292524'
            }
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #f5f5f4; }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05);
    }
    .gradient-text {
      background: linear-gradient(135deg, #e11d48, #d97706);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen text-fest-dark flex overflow-hidden selection:bg-fest-rose selection:text-white font-sans relative">

  <!-- Soft animated background gradient -->
  <div class="fixed inset-0 z-0 opacity-40 pointer-events-none" style="background: radial-gradient(circle at 10% 20%, rgba(225,29,72,0.1) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(217,119,6,0.1) 0%, transparent 40%);"></div>

  <!-- SIDEBAR -->
  <aside class="w-64 glass-card border-r border-stone-200 flex flex-col z-20 shrink-0 relative">
    <div class="p-6 border-b border-stone-100 flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-rose-500 to-amber-500 flex items-center justify-center text-white shadow-md">
        <i data-lucide="tent" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-xl font-serif font-semibold tracking-wide text-fest-dark leading-tight">Cultura</h1>
        <p class="text-[10px] text-stone-500 uppercase tracking-widest font-semibold">Festival Hub</p>
      </div>
    </div>
    
    <nav class="flex-1 p-4 space-y-2 mt-4 text-sm font-medium">
      <a href="/" class="flex items-center gap-3 p-3 rounded-xl text-stone-500 hover:bg-stone-100 hover:text-fest-dark transition-colors">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        Dashboard
      </a>
      <a href="/analytics.html" class="flex items-center gap-3 p-3 rounded-xl bg-rose-50 text-fest-rose">
        <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
        Insights
      </a>
      <a href="/attendees.html" class="flex items-center gap-3 p-3 rounded-xl text-stone-500 hover:bg-stone-100 hover:text-fest-dark transition-colors">
        <i data-lucide="users" class="w-5 h-5"></i>
        Guests
      </a>
      <a href="/recharge.html" class="flex items-center gap-3 p-3 rounded-xl text-stone-500 hover:bg-stone-100 hover:text-fest-dark transition-colors">
        <i data-lucide="wallet" class="w-5 h-5"></i>
        Recharge & Coins
      </a>
      <a href="/scanner.html" class="flex items-center gap-3 p-3 rounded-xl text-stone-500 hover:bg-stone-100 hover:text-fest-dark transition-colors">
        <i data-lucide="qr-code" class="w-5 h-5"></i>
        Field Scanner
      </a>
      <a href="/settings.html" class="flex items-center gap-3 p-3 rounded-xl text-stone-500 hover:bg-stone-100 hover:text-fest-dark transition-colors">
        <i data-lucide="settings" class="w-5 h-5"></i>
        Operations
      </a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex flex-col relative z-10 h-screen overflow-hidden">
    
    <!-- TOP HEADER -->
    <header class="h-20 glass-card border-b border-stone-200 flex items-center justify-between px-8 shrink-0">
      
      <!-- NLP Search Form -->
      <form id="nlp-form" class="relative w-full max-w-xl">
        <div class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-rose-600">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
        </div>
        <input type="text" id="nlp-input" class="w-full bg-white dark:bg-stone-900 border border-stone-300 dark:border-stone-700 text-stone-900 dark:text-stone-100 text-sm font-medium rounded-xl focus:ring-2 focus:ring-rose-500 focus:border-rose-500 block pl-10 pr-24 p-2.5 shadow-sm transition-all placeholder-stone-500 dark:placeholder-stone-400" placeholder="Ask Assistant (e.g. 'Crowded zones?', 'Scan metrics?')...">
        <div class="absolute inset-y-1.5 right-1.5 flex items-center gap-1.5">
          <kbd class="hidden md:inline-block px-1.5 py-0.5 text-[10px] font-mono font-bold rounded bg-stone-100 text-stone-500 dark:bg-stone-800 dark:text-stone-400 border border-stone-200 dark:border-stone-700">⌘K</kbd>
          <button type="submit" class="px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-bold tracking-wide transition-colors shadow-sm cursor-pointer">
            ASK
          </button>
        </div>
      </form>
      
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 text-xs px-4 py-2 rounded-xl bg-white border border-stone-200 shadow-sm font-medium">
           <span id="poll-indicator" class="w-2.5 h-2.5 rounded-full bg-stone-300 transition-all duration-300"></span>
           <span class="text-stone-500">Live Sync:</span>
           <span id="last-sync" class="text-emerald-600 font-semibold">00:00</span>
        </div>
      </div>
    </header>

    
    <!-- ANALYTICS SCROLLABLE AREA -->
    <div class="flex-1 overflow-y-auto p-8 no-scrollbar relative">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h2 class="text-2xl font-serif font-bold text-fest-dark">Festival Insights</h2>
          <p class="text-stone-500 text-sm mt-1">Real-time attendance metrics and crowd distribution.</p>
        </div>
        <div class="flex items-center gap-3">
          <button class="px-4 py-2 bg-white border border-stone-200 text-stone-600 hover:bg-stone-50 rounded-xl font-bold text-sm shadow-sm transition-colors flex items-center gap-2">
            <i data-lucide="download" class="w-4 h-4"></i> Export CSV
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
        
        <!-- BAR CHART -->
        <div class="glass-card p-6 rounded-3xl border border-stone-200">
          <h3 class="text-lg font-bold text-fest-dark mb-4">Live Area Capacity</h3>
          <div class="relative h-72 w-full">
            <canvas id="capacityChart"></canvas>
          </div>
        </div>

        <!-- RECENT ACTIVITY LOG -->
        <div class="glass-card p-6 rounded-3xl border border-stone-200 flex flex-col h-full max-h-96">
          <h3 class="text-lg font-bold text-fest-dark mb-4">Latest Guest Movements</h3>
          <div id="activity-log" class="space-y-3 overflow-y-auto pr-2 flex-1">
             <div class="text-stone-400 text-center py-10">Loading insights...</div>
          </div>
        </div>
        
      </div>
      
    </div>
  </main>

  <script>
    let capacityChartInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      fetchAnalyticsData();
      setInterval(fetchAnalyticsData, 5000); // refresh every 5s
    });

    async function fetchAnalyticsData() {
      try {
        const res = await fetch('/api/admin/stats', {
            headers: { 'X-Admin-Key': sessionStorage.getItem('adminKey') || localStorage.getItem('adminKey') || '' }
        });
        if (res.ok) {
          const data = await res.json();
          updateChart(data.zones);
          updateLog(data.recent_logs);
        }
      } catch (err) {
        console.error("Error loading analytics", err);
      }
    }
    
    function updateChart(zones) {
      const labels = zones.map(z => z.zone_name);
      const dataPoints = zones.map(z => z.total_scans);
      
      const ctx = document.getElementById('capacityChart').getContext('2d');
      if (capacityChartInstance) {
          capacityChartInstance.data.labels = labels;
          capacityChartInstance.data.datasets[0].data = dataPoints;
          capacityChartInstance.update();
      } else {
          capacityChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [{
                label: 'Total Guests Checked In',
                data: dataPoints,
                backgroundColor: 'rgba(225, 29, 72, 0.8)',
                borderRadius: 8,
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } },
                x: { grid: { display: false } }
              }
            }
          });
      }
    }
    
    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;')
                          .replace(/</g, '&lt;')
                          .replace(/>/g, '&gt;')
                          .replace(/"/g, '&quot;')
                          .replace(/'/g, '&#039;');
    }
    
    function updateLog(logs) {
       const container = document.getElementById('activity-log');
       if(!logs || logs.length === 0) return;
       container.innerHTML = '';
       logs.forEach(log => {
          const isVip = log.role === 'VIP';
          const div = document.createElement('div');
          div.className = "flex items-center gap-4 p-3 rounded-xl bg-stone-50 border border-stone-100";
          div.innerHTML = `
            <div class="w-10 h-10 rounded-full flex items-center justify-center ${isVip ? 'bg-rose-100 text-rose-600' : 'bg-emerald-100 text-emerald-600'}">
              <i data-lucide="${isVip ? 'star' : 'user'}" class="w-5 h-5"></i>
            </div>
            <div class="flex-1">
              <p class="text-sm font-bold text-fest-dark">${escapeHTML(log.attendee_name)} <span class="text-xs font-normal text-stone-500 ml-1">(${escapeHTML(log.role)})</span></p>
              <p class="text-xs text-stone-500">Entered <span class="font-bold">${escapeHTML(log.zone_name)}</span></p>
            </div>
            <div class="text-xs text-stone-400">Just now</div>
          `;
          container.appendChild(div);
       });
       lucide.createIcons();
    }
  </script>
  <script src="/nlp-assistant.js"></script>
</body>
</html>
